#cloud-config
# Nomad Client / Compute Worker Node Provisioning
package_update: true
packages:
  - curl
  - jq
  - unzip
  - gpg
  - lsb-release
  - apt-transport-https
  - ca-certificates
  - gnupg

runcmd:
  # Install Docker Engine
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker

  # Install Consul and Nomad
  - curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
  - echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list
  - apt-get update -y
  - apt-get install -y consul nomad

  # Configure Consul Client
  - mkdir -p /etc/consul.d /opt/consul/data
  - |
    cat <<EOF > /etc/consul.d/consul.hcl
    datacenter = "${DATACENTER}"
    data_dir = "/opt/consul/data"
    server = false
    bind_addr = "{{ GetInterfaceIP \"eth1\" }}"
    client_addr = "0.0.0.0"
    retry_join = ["provider=digitalocean tag_name=consul-server"]
    EOF
  - systemctl enable consul
  - systemctl start consul

  # Configure Nomad Client
  - mkdir -p /etc/nomad.d /opt/nomad/data
  - |
    cat <<EOF > /etc/nomad.d/nomad.hcl
    datacenter = "${DATACENTER}"
    data_dir = "/opt/nomad/data"
    bind_addr = "{{ GetInterfaceIP \"eth1\" }}"

    client {
      enabled = true
      options = {
        "docker.privileged.enabled" = "false"
        "driver.raw_exec.enable"    = "false"
      }
    }

    consul {
      address = "127.0.0.1:8500"
      auto_advertise = true
      server_auto_join = true
      client_auto_join = true
    }
    EOF
  - systemctl enable nomad
  - systemctl start nomad
