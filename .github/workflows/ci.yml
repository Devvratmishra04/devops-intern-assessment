name: CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    name: Build & Functional Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f sample_backend/requirements.txt ]; then pip install -r sample_backend/requirements.txt; fi

      - name: Run hello.py
        run: python hello.py

      - name: Run sysinfo script
        run: |
          chmod +x scripts/sysinfo.sh
          bash scripts/sysinfo.sh

      - name: Build Docker image
        run: docker build -t hello-devops:latest .

      - name: Run Docker container
        run: docker run --rm hello-devops:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hello-devops:latest'
          format: 'table'
          exit-code: '0' # Non-blocking (learning period)
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sast-security-scan:
    name: SAST Code Analysis (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required for SARIF upload
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for accurate git-diff / PR scanning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retrieve SAST Secrets from HashiCorp Vault
        uses: hashicorp/vault-action@v3
        continue-on-error: true # Graceful fallback when Vault instance is not reachable in public PRs
        with:
          url: ${{ secrets.VAULT_ADDR || 'http://127.0.0.1:8200' }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            secret/data/ci/sast SEMGREP_APP_TOKEN | SEMGREP_APP_TOKEN ;
            secret/data/ci/sast SAST_WEBHOOK_URL | SAST_WEBHOOK_URL

      - name: Install Semgrep & Bandit
        run: |
          python -m pip install --upgrade pip
          pip install semgrep bandit

      - name: Run SAST Baseline Scan (High & Critical Severity)
        run: |
          echo "=== Starting SAST Scanning (Flask, Django, OWASP Top 10) ==="
          # Execute Semgrep using local baseline rules and standard security packs
          semgrep scan \
            --config=tasks/sast_pipeline_validation/.semgrep.yml \
            --config=p/flask \
            --config=p/django \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --severity=ERROR \
            --sarif \
            --output=semgrep-results.sarif \
            --metrics=off || true

          # Output human-readable summary to console
          semgrep scan \
            --config=tasks/sast_pipeline_validation/.semgrep.yml \
            --severity=ERROR \
            --metrics=off || true

      - name: Upload SAST SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-sast
